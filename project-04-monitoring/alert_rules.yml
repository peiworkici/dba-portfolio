groups:
  - name: postgres_alerts
    rules:
      - alert: PostgresSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is unavailable
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count>80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Database connections are high 
